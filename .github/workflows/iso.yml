name: Build TSOS ISO

on:
  workflow_dispatch:
  push:
    tags:
      - "iso-*"

permissions:
  contents: write

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache
          sudo docker system prune --all --force --volumes
          df -h

      - name: Build TSOS Arch Linux ISO
        run: |
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:/src" \
            archlinux:latest \
            bash -lc 'TSOS_ISO_OUT=/src/out /src/iso/build.sh'
          sudo chown -R "$USER:$USER" out
          df -h
          ls -lh out

      - name: Prepare release assets
        id: release
        shell: bash
        run: |
          set -euo pipefail
          cd out
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="iso-$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}"
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          ls -lh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          Bootable TSOS installer. After boot the first console starts the
          installer (Arch Linux plus tabbyapi-stack). Packages, Python,
          PyTorch, ComfyUI, Docker images, and model weights download during
          that install. ComfyUI-GGUF is frozen in the image.

          Write directly (replace `/dev/sdX` with the whole USB device):

              sudo dd if=tsos-archlinux.iso of=/dev/sdX bs=4M status=progress oflag=sync

          Boot with Secure Boot disabled. Use Ethernet or Alt+F2 + `iwctl`
          for Wi-Fi. Esc/Ctrl+C leaves a root shell.
          EOF
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" out/* --clobber
          else
            gh release create "$RELEASE_TAG" out/* \
              --title "TSOS Arch Linux ISO $RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
