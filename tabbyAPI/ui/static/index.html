<!DOCTYPE html>
<html lang="en" class="ui-loading">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TabbyAPI Stack</title>
  <style>
    html { background: var(--boot-bg, #0b0d12); color-scheme: dark; }
    body { margin: 0; background: var(--boot-bg, #0b0d12); color: #e8ecf4; }
    html.ui-loading body { visibility: hidden; }
    html.ui-loading::before {
      content: "";
      position: fixed;
      inset: 0;
      background: var(--boot-bg, #0b0d12);
      z-index: 2147483647;
      pointer-events: none;
    }
  </style>
  <noscript>
    <style>
      html.ui-loading body { visibility: visible; }
      html.ui-loading::before { content: none; }
    </style>
  </noscript>
  <script>
    window.TABBY_UI_BASE = (function () {
      var p = location.pathname || "";
      var m = "/v1/ui";
      var i = p.indexOf(m);
      return i >= 0 ? p.slice(0, i + m.length) : m;
    })();
    window.TABBY_UI_PREFS = null;
    window.TABBY_REVEAL_UI = function () {
      document.documentElement.classList.remove("ui-loading");
    };
    setTimeout(window.TABBY_REVEAL_UI, 8000);
    (function () {
      var FAMILIES = { midnight: 1, ember: 1, glacier: 1, moss: 1, contrast: 1 };
      var MODES = { dark: 1, light: 1, system: 1 };
      var BG = {
        "midnight-dark": "#0b0d12",
        "midnight-light": "#f4f6fb",
        "ember-dark": "#140e0c",
        "ember-light": "#faf4eb",
        "glacier-dark": "#0a1218",
        "glacier-light": "#f2f7fa",
        "moss-dark": "#0e1410",
        "moss-light": "#f3f6f1",
        "contrast-dark": "#000000",
        "contrast-light": "#ffffff"
      };
      function prefs() { return window.TABBY_UI_PREFS || {}; }
      function read(key, fallback, allowed) {
        var v = prefs()[key] || "";
        return allowed[v] ? v : fallback;
      }
      function family() { return read("theme", "midnight", FAMILIES); }
      function mode() { return read("mode", "dark", MODES); }
      function resolved() {
        var m = mode();
        if (m === "system") {
          m = (window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches) ? "light" : "dark";
        }
        return family() + "-" + m;
      }
      function apply(id) {
        id = id || resolved();
        var root = document.documentElement;
        var bg = BG[id] || BG["midnight-dark"];
        var light = /-light$/.test(id);
        root.setAttribute("data-theme", id);
        root.style.colorScheme = light ? "light" : "dark";
        root.style.setProperty("--boot-bg", bg);
        root.style.background = bg;
      }
      window.TABBY_THEME_BOOT = {
        FAMILIES: ["midnight", "ember", "glacier", "moss", "contrast"],
        LABELS: { midnight: "Midnight", ember: "Ember", glacier: "Glacier", moss: "Moss", contrast: "Contrast" },
        MODES: ["dark", "light", "system"],
        MODE_LABELS: { dark: "Dark", light: "Light", system: "System" },
        BG: BG,
        family: family,
        mode: mode,
        resolved: resolved,
        apply: apply
      };
      apply();
      (function () {
        var n = parseInt(prefs().zoom, 10);
        if (!isFinite(n)) n = 100;
        n = Math.min(150, Math.max(75, Math.round(n / 5) * 5));
        document.documentElement.style.setProperty("--ui-zoom", String(n / 100));
      })();
    })();
    // Bust browser/proxy caches when chat status UI changes.
    window.TABBY_UI_ASSET_V = "20260905-imagehold";
    // document.write keeps CSS render-blocking. createElement("link") does not,
    // and unhiding on the first sheet's onload flashed the unstyled shell.
    document.write('<link rel="stylesheet" href="' + TABBY_UI_BASE + "/assets/styles.css?v=" + TABBY_UI_ASSET_V + '">');
    document.write('<link rel="stylesheet" href="' + TABBY_UI_BASE + "/assets/xterm.css?v=" + TABBY_UI_ASSET_V + '">');
  </script>
</head>
<body>
  <header class="app-header">
    <div class="brand compact">
      <div class="brand-mark" aria-hidden="true"></div>
      <div>
        <p class="eyebrow">TabbyAPI Stack</p>
        <strong id="header-title">Chat</strong>
      </div>
    </div>
    <nav class="tabs" aria-label="Main">
      <a href="#chat" data-page="chat" class="tab is-active">Chat</a>
      <a href="#status" data-page="status" class="tab">Status</a>
      <a href="#gallery" data-page="gallery" class="tab">Gallery</a>
      <a href="#logs" data-page="logs" class="tab">Logs</a>
      <a href="#users" data-page="users" class="tab" id="tab-users" hidden>Users</a>
      <a href="#settings" data-page="settings" class="tab" id="tab-settings" hidden>Settings</a>
    </nav>
    <div class="header-meta">
      <div class="context-menu" id="context-menu">
        <button type="button" id="context-chip" class="context-usage-widget" hidden aria-haspopup="true" aria-expanded="false" aria-label="Context window usage">
          <span class="icon-container" aria-hidden="true">
            <svg class="circular-progress" viewBox="0 0 36 36">
              <circle class="progress-bg" cx="18" cy="18" r="14"></circle>
              <circle class="progress-arc" cx="18" cy="18" r="14" stroke-dasharray="87.9646" stroke-dashoffset="87.9646"></circle>
            </svg>
          </span>
          <span class="percentage-label" id="context-chip-pct">0%</span>
        </button>
        <div class="user-menu-panel" id="context-menu-panel" hidden>
          <p class="context-usage-head">Context window</p>
          <p class="context-usage-tokens" id="context-usage-tokens"></p>
          <p class="context-usage-pct" id="context-usage-pct"></p>
          <p class="context-usage-note" id="context-usage-note" hidden>Quality may decline as limit nears.</p>
          <p class="context-usage-est" id="context-usage-est" hidden>Estimated from this chat. A reply uses the real prompt size.</p>
          <button type="button" class="user-menu-item" id="context-handoff">Continue in new chat</button>
        </div>
      </div>
      <div class="gpu-menu" id="gpu-menu">
        <button type="button" id="gpu-chip" class="chip" aria-haspopup="menu" aria-expanded="false" aria-label="GPU and model">
          <span id="gpu-chip-label">GPU …</span>
        </button>
        <div class="user-menu-panel" id="gpu-menu-panel" hidden role="menu"></div>
      </div>
      <button type="button" id="settings-btn" class="chip quiet" hidden aria-label="Settings" title="Settings">
        <svg class="user-chip-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="3.1" fill="none" stroke="currentColor" stroke-width="1.7"/>
          <path d="M12 4.2v2.1M12 17.7v2.1M4.2 12h2.1M17.7 12h2.1M6.5 6.5l1.5 1.5M16 16l1.5 1.5M6.5 17.5l1.5-1.5M16 8l1.5-1.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
      </button>
      <div class="user-menu" id="user-menu">
        <button type="button" id="user-chip" class="chip quiet" aria-haspopup="menu" aria-expanded="false" aria-label="Account">
          <svg class="user-chip-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="8.2" r="3.4" />
            <path d="M5.6 18.8c.8-3.2 3.2-4.8 6.4-4.8s5.6 1.6 6.4 4.8" />
          </svg>
          <span id="user-chip-name"></span>
        </button>
        <div class="user-menu-panel" id="user-menu-panel" hidden role="menu">
          <div class="user-menu-sub">
            <button type="button" class="user-menu-item" id="user-menu-theme" aria-haspopup="true" aria-expanded="false">
              <span>Theme</span><kbd id="user-menu-theme-hint">Midnight</kbd>
            </button>
            <div class="user-menu-flyout" id="user-menu-theme-flyout" hidden role="menu"></div>
          </div>
          <div class="user-menu-sub">
            <button type="button" class="user-menu-item" id="user-menu-mode" aria-haspopup="true" aria-expanded="false">
              <span>Appearance</span><kbd id="user-menu-mode-hint">Dark</kbd>
            </button>
            <div class="user-menu-flyout" id="user-menu-mode-flyout" hidden role="menu"></div>
          </div>
          <div class="user-menu-zoom">
            <span id="user-menu-zoom-label">Zoom</span>
            <input type="range" id="user-menu-zoom" min="75" max="150" step="5" value="100" aria-labelledby="user-menu-zoom-label" />
            <kbd id="user-menu-zoom-hint">100%</kbd>
          </div>
          <div class="user-menu-sep"></div>
          <button type="button" class="user-menu-item" data-user-act="settings" id="user-menu-settings" hidden>Settings</button>
          <button type="button" class="user-menu-item" data-user-act="keys">Keyboard shortcuts</button>
          <button type="button" class="user-menu-item" data-user-act="copy">Copy username</button>
          <button type="button" class="user-menu-item" data-user-act="backup">Download backup</button>
          <button type="button" class="user-menu-item" data-user-act="restore">Restore backup…</button>
          <button type="button" class="user-menu-item" data-user-act="fullscreen">Full screen</button>
          <button type="button" class="user-menu-item" data-user-act="restart" id="user-menu-restart" hidden>Restart API</button>
          <div class="user-menu-sep"></div>
          <button type="button" class="user-menu-item is-danger" data-user-act="logout">Log out</button>
        </div>
      </div>
      <input type="file" id="user-backup-file" accept=".zip,application/zip,application/x-zip-compressed" hidden />
    </div>
  </header>

  <main class="app-main">
    <section id="page-chat" class="page is-active" data-page="chat"></section>
    <section id="page-status" class="page" data-page="status" hidden></section>
    <section id="page-gallery" class="page" data-page="gallery" hidden></section>
    <section id="page-logs" class="page" data-page="logs" hidden></section>
    <section id="page-users" class="page" data-page="users" hidden></section>
    <section id="page-settings" class="page" data-page="settings" hidden></section>
  </main>

  <script>
    ["highlight.js", "utils.js", "xterm.js", "xterm-addon-fit.js", "monaco.js", "lsp.js", "palette.js", "logs.js", "chat.js", "status.js", "gallery.js", "users.js", "settings.js", "app.js"].forEach(function (name) {
      document.write('<script src="' + TABBY_UI_BASE + "/assets/" + name + "?v=" + TABBY_UI_ASSET_V + '"><\/script>');
    });
  </script>
</body>
</html>
